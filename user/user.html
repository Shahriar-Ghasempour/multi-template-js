<!-- user.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="user.css">
</head>
<body>
  <div class="container py-5">
    <h2 class="mb-4 text-center">User Information Form :)</h2>
    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    <form id="userForm" novalidate>
      <div class="mb-3">
        <label for="firstName" class="form-label">First Name</label>
        <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter first name">
      </div>

      <div class="mb-3">
        <label for="lastName" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Enter last name">
      </div>

      <div class="mb-3">
        <label for="birthPlace" class="form-label">Place of Birth</label>
        <input type="text" class="form-control" id="birthPlace" name="birthPlace" placeholder="Enter place of birth">
      </div>

      <div class="mb-3">
        <label for="major" class="form-label">Field of Study</label>
        <input type="text" class="form-control" id="major" name="major" placeholder="Enter field of study">
      </div>

      <div class="mb-3">
        <label for="interests" class="form-label">Interests</label>
        <textarea class="form-control" id="interests" name="interests" rows="3" placeholder="List your interests"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="user.js"></script>
</body>
</html>
