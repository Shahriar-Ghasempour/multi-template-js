<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>admin panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">admin calculator :)</h1>
    <div class="card mx-auto" style="max-width: 400px;">
      <div class="card-body">
        <input type="text" id="display" class="form-control mb-3 text-end" readonly>
        <div class="row g-2">
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="7">7</button></div>
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="8">8</button></div>
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="9">9</button></div>
          <div class="col-3"><button class="btn btn-outline-danger btn-block" data-action="clear">C</button></div>

          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="4">4</button></div>
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="5">5</button></div>
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="6">6</button></div>
          <div class="col-3"><button class="btn btn-outline-primary btn-block" data-value="/">÷</button></div>

          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="1">1</button></div>
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="2">2</button></div>
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="3">3</button></div>
          <div class="col-3"><button class="btn btn-outline-primary btn-block" data-value="*">*</button></div>

          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value="0">0</button></div>
          <div class="col-3"><button class="btn btn-outline-secondary btn-block" data-value=".">.</button></div>
          <div class="col-3"><button class="btn btn-outline-success btn-block" data-action="calculate">=</button></div>
          <div class="col-3"><button class="btn btn-outline-primary btn-block" data-value="-">-</button></div>

          <div class="col-9"><button class="btn btn-outline-primary btn-block w-100" data-value="+">+</button></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
